<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code Feishu Companion — video storyboard prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f3ef;
      --muted: #a7a6a2;
      --panel: #171816;
      --line: rgba(255,255,255,.11);
      --green: #68d391;
      --blue: #5b8cff;
      --orange: #f5a623;
      --cream: #f0e8d8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0c0b; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 26px 28px 104px; }
    .prototype-note { display: flex; justify-content: space-between; gap: 20px; align-items: end; max-width: 1240px; margin: 0 auto 18px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 6px 0 0; font-size: clamp(22px, 3vw, 38px); letter-spacing: -.04em; }
    .prototype-note p { margin: 0; max-width: 470px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: right; }
    .stage-shell { max-width: 1240px; margin: auto; }
    .stage { position: relative; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 20px; background: #101110; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    .variant-tag { position: absolute; z-index: 20; left: 18px; top: 18px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(8,9,8,.78); backdrop-filter: blur(12px); color: #d5d4ce; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .scene { position: absolute; inset: 0; opacity: 0; transform: scale(1.015); transition: opacity .38s ease, transform .5s ease; pointer-events: none; }
    .scene.active { opacity: 1; transform: scale(1); pointer-events: auto; }
    .terminal { height: 100%; padding: 66px 42px 38px; background: radial-gradient(circle at 18% 0%, #2a2a25 0, #171816 37%, #111210 100%); font: 500 clamp(12px, 1.25vw, 20px)/1.58 "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #e7e4da; }
    .terminal-bar { position: absolute; top: 16px; left: 18px; right: 18px; height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--line); color: #898a85; font: 11px ui-sans-serif, system-ui; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
    .dot:nth-child(1) { background: #ff6b62; } .dot:nth-child(2) { background: #e9bf4b; } .dot:nth-child(3) { background: #62c554; }
    .term-title { margin-left: 8px; }
    .prompt { color: #b8e986; }
    .command { color: #f4f0e6; }
    .dim { color: #797b76; }
    .claude-mark { color: #de8f6e; font-weight: 800; }
    .terminal-copy { max-width: 980px; white-space: pre-wrap; }
    .cursor { display: inline-block; width: .55em; height: 1.05em; margin-left: 3px; vertical-align: -.14em; background: #e8e5dc; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .split { display: grid; grid-template-columns: 57% 43%; height: 100%; background: #111210; transition: grid-template-columns .55s cubic-bezier(.2,.8,.2,1); }
    .split .terminal { padding-right: 30px; font-size: clamp(10px, 1.05vw, 17px); }
    .split.terminal-focus { grid-template-columns: 63% 37%; }
    .split.phone-focus { grid-template-columns: 47% 53%; }
    .split.balanced { grid-template-columns: 52% 48%; }
    .split.phone-focus .terminal { filter: brightness(.65); }
    .split.phone-focus .phone { transform: scale(1.055); }
    .split.balanced .phone { transform: scale(1.02); }
    .phone-zone { display: grid; place-items: center; padding: 40px; background: radial-gradient(circle at 50% 50%, #26322c, #121513 69%); }
    .phone { position: relative; width: min(76%, 350px); aspect-ratio: 9 / 17.5; border: 7px solid #2d2e2c; border-radius: 35px; background: #f1f2f5; color: #202124; box-shadow: 0 24px 60px rgba(0,0,0,.45); overflow: hidden; transition: transform .55s cubic-bezier(.2,.8,.2,1); }
    .phone-top { height: 38px; padding: 11px 16px 0; display: flex; justify-content: space-between; font-size: 9px; font-weight: 700; }
    .chat-head { height: 43px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #dedfe2; background: #fff; font-size: 11px; font-weight: 750; }
    .bot-avatar { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; background: #242a26; color: white; font-size: 11px; }
    .chat { padding: 12px; }
    .card { overflow: hidden; border: 1px solid #dfe1e4; border-radius: 9px; background: white; box-shadow: 0 5px 18px rgba(0,0,0,.08); font-size: 9px; }
    .card-head { padding: 10px 11px; background: #e8f7ee; border-bottom: 1px solid #d6eadc; }
    .card-head.orange { background: #fff1db; border-color: #f2d8ad; }
    .card-title { font-size: 11px; font-weight: 800; }
    .card-sub { margin-top: 3px; color: #676a6f; }
    .card-body { padding: 10px 11px 11px; line-height: 1.45; }
    .card-body hr { border: 0; border-top: 1px solid #ececef; margin: 9px 0; }
    .label { font-weight: 800; margin-bottom: 4px; }
    .activity { color: #50535a; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
    button { font: inherit; }
    .card-button { border: 1px solid #d4d7dd; border-radius: 6px; background: white; padding: 7px 4px; color: #32353a; font-weight: 750; }
    .card-button.primary { border-color: #3370ff; background: #3370ff; color: white; }
    .chat-bubble { margin: 20px 0 7px auto; padding: 9px 10px; width: 88%; border-radius: 10px 2px 10px 10px; background: #3370ff; color: white; font-size: 9px; line-height: 1.4; }
    .reply { margin-right: auto; width: max-content; padding: 7px 9px; border-radius: 2px 9px 9px 9px; background: white; border: 1px solid #e0e1e4; font-size: 9px; }
    .endline { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; font-size: clamp(24px, 3.4vw, 54px); font-weight: 820; letter-spacing: -.045em; text-shadow: 0 4px 28px #000; }
    .brandline { display: block; margin-top: 9px; color: #bfc1bb; font-size: .3em; letter-spacing: .1em; text-transform: uppercase; }
    .beats { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 6px; }
    .beat { min-width: 150px; flex: 1; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: #141513; color: #a9aaa5; text-align: left; cursor: pointer; }
    .beat.active { border-color: var(--green); color: white; background: #1b211d; }
    .beat-time { display: block; color: #6f716d; font-size: 10px; margin-bottom: 4px; }
    .beat-name { display: block; font-weight: 750; font-size: 12px; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .play { border: 1px solid var(--line); border-radius: 999px; background: #f1efe8; color: #151614; padding: 9px 15px; font-weight: 800; cursor: pointer; }
    .switcher { position: fixed; z-index: 100; left: 50%; bottom: 22px; transform: translateX(-50%); display: grid; grid-template-columns: 42px minmax(190px, auto) 42px; align-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 5px; background: rgba(24,25,23,.92); box-shadow: 0 12px 32px rgba(0,0,0,.38); backdrop-filter: blur(18px); }
    .switcher button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: white; cursor: pointer; font-size: 18px; }
    .switcher button:hover { background: rgba(255,255,255,.09); }
    .switch-label { padding: 0 14px; text-align: center; font-size: 12px; font-weight: 750; }
    .full-phone { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle, #24382e, #0e100f 70%); }
    .full-phone .phone { height: 86%; width: auto; }
    .desk { height: 100%; background: linear-gradient(130deg, #272a25, #111310); display: grid; grid-template-columns: 1fr .68fr; gap: 6%; align-items: center; padding: 8%; }
    .monitor { position: relative; aspect-ratio: 16/10; border: 11px solid #242522; border-radius: 13px; overflow: hidden; box-shadow: 0 22px 44px rgba(0,0,0,.5); }
    .monitor .terminal { padding: 55px 24px 22px; font-size: clamp(8px, .9vw, 14px); }
    .desk-phone { transform: rotate(5deg); width: 62%; justify-self: center; }
    .pulse { height: 100%; display: grid; place-items: center; background: #efeee8; color: #141512; padding: 7%; }
    .pulse-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; gap: 5%; }
    .pulse-panel { border: 1px solid #d6d4cb; border-radius: 16px; padding: 24px; background: white; min-height: 210px; box-shadow: 0 12px 35px rgba(30,30,20,.08); }
    .pulse-terminal { background: #171816; color: #eeeae0; font: 12px/1.6 monospace; }
    .bridge { color: #236a45; font-size: 34px; font-weight: 900; }
    .pulse-copy { font-size: clamp(22px, 3vw, 48px); line-height: 1.02; font-weight: 850; letter-spacing: -.05em; }
    @media (max-width: 760px) {
      body { padding: 16px 12px 95px; }
      .prototype-note { display: block; }
      .prototype-note p { margin-top: 8px; text-align: left; }
      .phone-zone { padding: 18px; }
      .phone { width: 90%; }
      .beats { display: grid; grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="prototype-note">
    <div>
      <div class="eyebrow">Throwaway storyboard prototype</div>
      <h1 id="title">A — Parallel bridge</h1>
    </div>
    <p id="description">The terminal stays visible while Feishu takes over. Best at proving this is one continuous session.</p>
  </header>

  <main class="stage-shell">
    <section class="stage" id="stage" aria-live="polite"></section>
    <nav class="beats" id="beats" aria-label="Storyboard beats"></nav>
    <div class="controls">
      <button class="play" id="play">▶ Play cut</button>
      <span id="counter"></span>
    </div>
  </main>

  <nav class="switcher" aria-label="Prototype variant switcher">
    <button id="previous" aria-label="Previous variant">←</button>
    <div class="switch-label" id="switch-label">A — Parallel bridge</div>
    <button id="next" aria-label="Next variant">→</button>
  </nav>

  <script>
    const command = '<span class="prompt">$</span> <span class="command">claude --dangerously-load-development-channels<br>  server:claude-companion</span>';
    const prompt = '<span class="claude-mark">Claude Code</span>\n\n<span class="prompt">›</span> Fix the failing expired-token test. Change only the validator,\n  then run exactly go test ./... once.<span class="cursor"></span>';
    const workingCard = `<div class="card"><div class="card-head"><div class="card-title">🟢 Working · 8s</div><div class="card-sub">refresh-token-demo</div></div><div class="card-body"><div class="label">Current progress</div>Checking refresh-token validation and the failing tests.<hr><div class="label">Recent activity</div><div class="activity">✓ Read 2 files<br>◌ Updating token.go</div><hr><span class="activity">Activity just now</span></div></div>`;
    const permissionCard = `<div class="card"><div class="card-head orange"><div class="card-title">⚠️ Permission requested</div><div class="card-sub">refresh-token-demo</div></div><div class="card-body">Claude wants to run:<hr><div class="label">Run shell command</div><code>go test ./...</code><hr><div class="label">In</div><code>…/demo-task</code><div class="buttons"><button class="card-button primary">Allow once</button><button class="card-button">Deny</button></div></div></div>`;
    const completeCard = `<div class="card"><div class="card-head"><div class="card-title">✅ Completed · 42s</div><div class="card-sub">refresh-token-demo</div></div><div class="card-body">Fixed expired-token validation.<hr><div class="label">Validation</div><div>✓ go test ./... passed</div></div></div>`;
    const phone = content => `<div class="phone"><div class="phone-top"><span>9:41</span><span>5G ▮</span></div><div class="chat-head"><div class="bot-avatar">CC</div>Claude Code Feishu Companion</div><div class="chat">${content}</div></div>`;
    const terminal = content => `<div class="terminal"><div class="terminal-bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="term-title">refresh-token-demo — zsh</span></div><div class="terminal-copy">${content}</div></div>`;
    const variants = {
      A: {
        name: 'Cinematic parallel bridge',
        description: 'Selected direction: both surfaces stay visible while scale and light guide attention between them.',
        scenes: [
          ['0:00–0:02', 'Launch honestly', terminal(command)],
          ['0:02–0:04', 'Give the task', terminal(prompt)],
          ['0:04–0:07', 'Walk away', `<div class="split terminal-focus">${terminal('<span class="dim">Investigating failing tests…</span>')}<div class="phone-zone">${phone(workingCard)}</div></div>`],
          ['0:07–0:11', 'Approve remotely', `<div class="split phone-focus">${terminal('<span class="dim">Waiting for permission…</span>')}<div class="phone-zone">${phone(permissionCard)}</div></div>`],
          ['0:11–0:14', 'See the result', `<div class="split balanced">${terminal('<span class="dim">Running tests…</span>')}<div class="phone-zone">${phone(completeCard)}</div></div>`],
          ['0:14–0:18', 'Continue from Feishu', `<div class="split phone-focus">${terminal('<span class="dim">Ready for your next instruction.</span>')}<div class="phone-zone">${phone(`${completeCard}<div class="chat-bubble">Give me a three-line issue update: root cause, fix, and verification.</div><div class="reply">Sent to refresh-token-demo.</div>`)}</div></div>`],
          ['0:18–0:22', 'Return to the same session', `${terminal('<span class="claude-mark">Claude</span>\nRoot cause: expired refresh tokens were accepted.\nFix: validation now returns ErrExpired.\nVerification: go test ./... passes.')}<div class="endline">Leave the desk. Keep the session.<span class="brandline">Claude Code Feishu Companion</span></div>`]
        ]
      },
      B: {
        name: 'Cinematic handoff',
        description: 'Full-frame focus moves from the real terminal to the phone and back. Cleaner and more emotional.',
        scenes: [
          ['0:00–0:03', 'At the desk', `<div class="desk"><div class="monitor">${terminal(command)}</div><div class="pulse-copy">Start where<br>you already work.</div></div>`],
          ['0:03–0:06', 'Real Claude Code', terminal(prompt)],
          ['0:06–0:09', 'Walk away', `<div class="full-phone">${phone(workingCard)}</div>`],
          ['0:09–0:13', 'One tap', `<div class="full-phone">${phone(permissionCard)}</div>`],
          ['0:13–0:17', 'Work finished', `<div class="full-phone">${phone(completeCard)}</div>`],
          ['0:17–0:21', 'Keep going', `<div class="full-phone">${phone(`<div class="chat-bubble">Give me a three-line issue update: root cause, fix, and verification.</div><div class="reply">Sent to refresh-token-demo.</div>`)}</div>`],
          ['0:21–0:25', 'Back at the desk', `<div class="desk"><div class="monitor">${terminal('<span class="claude-mark">Claude</span>\nRoot cause: expired tokens were accepted.\nFix: validation now returns ErrExpired.\nVerification: all tests pass.')}</div><div class="pulse-copy">Same session.<br>Same terminal.</div></div>`]
        ]
      }
    };

    const keys = Object.keys(variants);
    const params = new URLSearchParams(location.search);
    let currentVariant = keys.includes(params.get('variant')) ? params.get('variant') : 'A';
    let sceneIndex = 0;
    let timer = null;

    function render() {
      clearTimeout(timer);
      timer = null;
      const variant = variants[currentVariant];
      document.querySelector('#title').textContent = `${currentVariant} — ${variant.name}`;
      document.querySelector('#switch-label').textContent = `${currentVariant} — ${variant.name}`;
      document.querySelector('#description').textContent = variant.description;
      document.querySelector('#stage').innerHTML = `<div class="variant-tag">${currentVariant} · ${variant.name}</div>` + variant.scenes.map((scene, index) => `<article class="scene ${index === sceneIndex ? 'active' : ''}">${scene[2]}</article>`).join('');
      document.querySelector('#beats').innerHTML = variant.scenes.map((scene, index) => `<button class="beat ${index === sceneIndex ? 'active' : ''}" data-scene="${index}"><span class="beat-time">${scene[0]}</span><span class="beat-name">${scene[1]}</span></button>`).join('');
      document.querySelectorAll('.beat').forEach(button => button.addEventListener('click', () => { sceneIndex = Number(button.dataset.scene); render(); }));
      document.querySelector('#counter').textContent = `Beat ${sceneIndex + 1} of ${variant.scenes.length}`;
      document.querySelector('#play').textContent = '▶ Play cut';
    }

    function setVariant(offset) {
      const index = keys.indexOf(currentVariant);
      currentVariant = keys[(index + offset + keys.length) % keys.length];
      sceneIndex = 0;
      const nextParams = new URLSearchParams(location.search);
      nextParams.set('variant', currentVariant);
      history.replaceState(null, '', `${location.pathname}?${nextParams}`);
      render();
    }

    function play() {
      clearTimeout(timer);
      const variant = variants[currentVariant];
      document.querySelector('#play').textContent = 'Playing…';
      const advance = () => {
        if (sceneIndex >= variant.scenes.length - 1) {
          document.querySelector('#play').textContent = '↻ Replay cut';
          timer = null;
          return;
        }
        sceneIndex += 1;
        const scenes = document.querySelectorAll('.scene');
        scenes.forEach((scene, index) => scene.classList.toggle('active', index === sceneIndex));
        document.querySelectorAll('.beat').forEach((beat, index) => beat.classList.toggle('active', index === sceneIndex));
        document.querySelector('#counter').textContent = `Beat ${sceneIndex + 1} of ${variant.scenes.length}`;
        timer = setTimeout(advance, 1800);
      };
      if (sceneIndex === variant.scenes.length - 1) {
        sceneIndex = 0;
        render();
        document.querySelector('#play').textContent = 'Playing…';
      }
      timer = setTimeout(advance, 900);
    }

    document.querySelector('#previous').addEventListener('click', () => setVariant(-1));
    document.querySelector('#next').addEventListener('click', () => setVariant(1));
    document.querySelector('#play').addEventListener('click', play);
    document.addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === 'ArrowLeft') setVariant(-1);
      if (event.key === 'ArrowRight') setVariant(1);
    });
    render();
  </script>
</body>
</html>
